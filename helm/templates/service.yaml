---
# Frontend Service (nginx, port 8080)
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    app: darwin-store-frontend
    app.kubernetes.io/name: darwin-store-frontend
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.frontend.type }}
  ports:
    - port: {{ .Values.service.frontend.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: darwin-store-frontend
    app.kubernetes.io/instance: {{ .Release.Name }}
---
# Inventory API Service (FastAPI, port 8081)
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-inventory
  labels:
    app: darwin-store-inventory
    app.kubernetes.io/name: darwin-store-inventory
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.inventory.type }}
  ports:
    - port: {{ .Values.service.inventory.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: darwin-store-inventory
    app.kubernetes.io/instance: {{ .Release.Name }}
---
# Customer Management API Service (FastAPI, port 8082)
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-customers
  labels:
    app: darwin-store-customers
    app.kubernetes.io/name: darwin-store-customers
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.customers.type }}
  ports:
    - port: {{ .Values.service.customers.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: darwin-store-customers
    app.kubernetes.io/instance: {{ .Release.Name }}
---
# Chaos Controller Service (FastAPI, port 9000)
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-chaos
  labels:
    app: darwin-store-chaos
    app.kubernetes.io/name: darwin-store-chaos
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.chaos.type }}
  ports:
    - port: {{ .Values.service.chaos.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: darwin-store-chaos
    app.kubernetes.io/instance: {{ .Release.Name }}
